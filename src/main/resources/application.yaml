server:
  port: ${ACCOUNT_SERVICE_PORT:8081}

spring:
  application:
    name: account-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/ledger_house?currentSchema=account}
    username: ${ACCOUNT_DB_USERNAME:account_app}
    password: ${ACCOUNT_DB_PASSWORD:account_local}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: account
    schemas: account
    create-schemas: false
    validate-migration-naming: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: account

management:
  endpoints:
    web:
      exposure:
        include: health
